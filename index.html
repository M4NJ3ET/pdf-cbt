<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CBT Practice Portal</title>
  <link rel="stylesheet" href="styles.css">
  <!-- Supabase JS Client v2 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- PDF.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  </script>
</head>
<body>

  <!-- App Header -->
  <header class="header">
    <div class="nav-container">
      <div class="brand" onclick="window.location.hash='#/'" style="cursor:pointer;">
        <span>📝</span>
        <span>CBT Practice Portal</span>
      </div>
      <nav class="nav-links" id="nav-actions">
        <!-- Dynamically rendered by app.js -->
      </nav>
    </div>
  </header>

  <!-- Dynamic Page Root -->
  <main class="container" id="app-root">
    <div style="text-align:center; padding: 60px 0;">Loading application...</div>
  </main>

  <!-- Global Toast Notification Area -->
  <div id="toast-container"></div>

  <!-- Global Modal Mount -->
  <div id="modal-root"></div>

  <!-- Scripts -->
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/pdf-parser.js"></script>
  <script src="js/host.js"></script>
  <script src="js/exam.js"></script>
  <script src="js/results.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
